name: Python CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: northstar-application

      - name: Checkout northstar-core
        uses: actions/checkout@v4
        with:
          repository: Northstar-Dhruba/northstar-core
          path: northstar-core
          token: ${{ secrets.NORTHSTAR_CI_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Verify workspace dependency layout
        run: |
          pwd
          ls -la ..
          test -f ../northstar-core/pyproject.toml
          echo "northstar-core workspace dependency found"
        working-directory: northstar-application

      - name: Sync dependencies
        run: uv sync
        working-directory: northstar-application

      - name: Run Ruff
        run: uv run ruff check .
        working-directory: northstar-application

      - name: Run Ruff Formatter Check
        run: uv run ruff format --check .
        working-directory: northstar-application

      - name: Run Tests
        run: uv run pytest
        working-directory: northstar-application
